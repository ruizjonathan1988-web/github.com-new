name: APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Regénérer les styles
        run: python3 tools/gen_styles.py
      - name: Clé de signature
        env:
          KS_B64: ${{ secrets.BASSE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/basse.jks"; echo "BASSE_KEYSTORE=$RUNNER_TEMP/basse.jks" >> $GITHUB_ENV; fi
      - name: Compiler
        env:
          BASSE_KS_PASS: ${{ secrets.BASSE_KS_PASS }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk Basse-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: Basse-apk, path: 'Basse-*.apk' }
      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Basse 1.0.${{ github.run_number }}
          make_latest: true
          files: Basse-*.apk
